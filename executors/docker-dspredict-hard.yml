version: '3.8'
services:
  executor-000:
    image: executor-kaggle
    command: python main.py
    ports:
    - 60000:8432
    environment:
    - PORT=8432
    - CONTAINER_ID=0
    - HOST_PORT=60000
    - PYTHONUNBUFFERED=1
    - PYTHONDONTWRITEBYTECODE=1
    - EXECUTION_TIMEOUT=7200
    - WORKSPACE_FOLDER=/data
    - SUBMISSION_DIR=/submission
    restart: unless-stopped
    labels:
    - container.id=0
    - container.port=60000
    - container.type=executor-kaggle
    mem_limit: 6G
    cpus: 3.0
    extra_hosts:
    - host.docker.internal:host-gateway
    deploy:
      resources:
        reservations:
          memory: 128M
          devices:
          - driver: nvidia
            device_ids:
            - '0'
            capabilities:
            - gpu
    volumes:
    - ../data/data:/data:ro
    - ../submissions/container_000:/submission
  executor-001:
    image: executor-kaggle
    command: python main.py
