version: '3.8'
services:
  executor-000:
    image: executor-bio
    command: python main.py
    ports:
    - 61000:8432
    environment:
    - PORT=8432
    - CONTAINER_ID=0
    - HOST_PORT=61000
    - PYTHONUNBUFFERED=1
    - PYTHONDONTWRITEBYTECODE=1
    - EXECUTION_TIMEOUT=1200
    - WORKSPACE_FOLDER=/data
    restart: unless-stopped
    labels:
    - container.id=0
    - container.port=61000
    - container.type=executor-bio
    mem_limit: 10G
    cpus: 0.5
    mem_reservation: 512M
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    - ../data/data:/data:ro
